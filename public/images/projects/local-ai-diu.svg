<text x="585" y="273" font-size="29" font-weight="700">AIZip Harness</text>
<text x="585" y="307" font-size="19" fill="#b2c8d2">Interpret · Execute · Respond</text>
<text x="982" y="230" font-size="23" font-weight="700">Gemma 3 1B · NPU</text>
<text x="982" y="260" font-size="18" fill="#b2c8d2">llama-server / GGUF</text>
