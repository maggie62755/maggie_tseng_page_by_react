<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">On-Router AI and DIU Integration</title>
<desc id="desc">The command gateway forwards text requests to AIZip Harness. The harness uses local llama-server instances for Gemma 3 1B on the NPU and two classifiers on the CPU. It calls Genix DIU API to integrate backend services. All shown components run on the router.</desc>
<defs>
