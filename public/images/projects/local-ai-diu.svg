<text x="55" y="109" fill="#f2f7fa" font-size="43" font-weight="700">On-Router AI &amp; DIU Integration</text>
<rect x="40" y="140" width="1120" height="475" rx="22" fill="#102c39" stroke="#355261" stroke-width="2"/>
<text x="65" y="174" fill="#b2c8d2" font-size="16" letter-spacing="2">ROUTER / LOCAL EXECUTION</text>
<g fill="#183c4b" stroke="#496b7a">
